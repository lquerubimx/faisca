<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Faísca</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#cfe8ff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
  canvas{display:block;width:100vw;height:100vh}
  #status{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:15px;opacity:.75;padding:0 20px;pointer-events:none}
  #fala{position:fixed;left:0;right:0;top:18px;text-align:center;font-size:16px;opacity:.85;padding:0 24px;pointer-events:none;line-height:1.35}
  #gear{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:22px;border:1px solid #234;background:#0a1420;color:#8ab;font-size:22px;z-index:5}
  #cfg{position:fixed;inset:0;background:#05090fef;display:none;z-index:10;overflow:auto;padding:20px;box-sizing:border-box}
  #cfg h2{margin:0 0 14px;font-size:20px}
  #cfg label{display:block;font-size:14px;margin:14px 0 6px;opacity:.8}
  #cfg input,#cfg textarea{width:100%;box-sizing:border-box;background:#0d1826;color:#e6f2ff;border:1px solid #2a3f57;border-radius:10px;padding:12px;font-size:16px}
  #cfg textarea{height:120px;resize:vertical}
  .row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .row button{flex:1;min-width:120px;padding:14px;border-radius:12px;border:0;font-size:16px;font-weight:600}
  .ok{background:#2f7cf6;color:#fff}.sec{background:#1b2a3c;color:#cfe8ff}.danger{background:#4a1820;color:#ffd0d6}
  small{display:block;opacity:.6;margin-top:6px;line-height:1.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fala"></div>
<div id="status">Toque na tela pra falar comigo</div>
<button id="gear" aria-label="Configurações">⚙</button>

<div id="cfg">
  <h2>Configurações do droide</h2>
  <label>Chave da API da Anthropic</label>
  <input id="kKey" type="password" placeholder="sk-ant-..." autocomplete="off">
  <small>Fica salva só neste celular. Nunca coloque a chave dentro do arquivo.</small>
  <label>Nome do droide</label>
  <input id="kNome" placeholder="Ex.: Faísca">
  <label>Sobre você (o droide lê isso sempre)</label>
  <textarea id="kSobre" placeholder="Meu nome é..., faço live de GTA RP, gosto de..."></textarea>
  <label style="display:flex;gap:10px;align-items:center;font-size:16px;opacity:1"><input id="kSempre" type="checkbox" style="width:24px;height:24px"> Sempre ouvindo (acorda com o nome dele)</label>
  <label>Palavras pra acordar (separe por vírgula)</label>
  <input id="kWake" placeholder="ei faisca, faisca">
  <small>O reconhecimento às vezes escreve o nome de outro jeito (ex.: "Faísca" vira "faixa"). Coloque as variações aqui.</small>
  <label>Voz</label>
  <select id="kVoz" style="width:100%;background:#0d1826;color:#e6f2ff;border:1px solid #2a3f57;border-radius:10px;padding:12px;font-size:16px"></select>
  <label>Tom da voz: <span id="vTom"></span></label>
  <input id="kTom" type="range" min="0.5" max="1.6" step="0.05" style="padding:0">
  <label>Velocidade: <span id="vVel"></span></label>
  <input id="kVel" type="range" min="0.7" max="1.5" step="0.05" style="padding:0">
  <div class="row"><button class="sec" id="bTestar">🔊 Testar voz</button></div>
  <label style="display:flex;gap:10px;align-items:center;font-size:16px;opacity:1"><input id="kLegenda" type="checkbox" style="width:24px;height:24px"> Mostrar legenda na tela</label>
  <div class="row">
    <button class="ok" id="bSalvar">Salvar</button>
    <button class="sec" id="bFechar">Fechar</button>
  </div>
  <div class="row">
    <button class="danger" id="bLimpar">Apagar memória da conversa</button>
  </div>
</div>

<script>
// ---------- Configurações salvas no celular ----------
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const MODELO = 'claude-haiku-5-5'; // rápido e barato, bom pra conversa por voz
let historico = [];
try { historico = JSON.parse(LS.get('historico', '[]')) || []; } catch(e){ historico = []; }

const $ = id => document.getElementById(id);
const statusEl = $('status'), falaEl = $('fala');

function abrirCfg(){
  $('kKey').value = LS.get('apiKey','');
  $('kNome').value = LS.get('nome','Faísca');
  $('kSobre').value = LS.get('sobre','');
  $('kSempre').checked = LS.get('sempre','1') === '1';
  $('kWake').value = LS.get('wake','ei faisca, faisca, e faisca');
  preencherVozes();
  $('kTom').value = LS.get('tom','1'); $('kVel').value = LS.get('vel','1.05');
  $('vTom').textContent = $('kTom').value; $('vVel').textContent = $('kVel').value;
  $('kLegenda').checked = LS.get('legenda','0') === '1';
  $('cfg').style.display = 'block';
}
$('gear').onclick = e => { e.stopPropagation(); abrirCfg(); };
$('bFechar').onclick = () => $('cfg').style.display = 'none';
$('bSalvar').onclick = () => {
  LS.set('apiKey', $('kKey').value.trim());
  LS.set('nome', $('kNome').value.trim() || 'Faísca');
  LS.set('sobre', $('kSobre').value.trim());
  LS.set('sempre', $('kSempre').checked ? '1' : '0');
  LS.set('wake', $('kWake').value.trim() || 'ei faisca, faisca');
  LS.set('voz', $('kVoz').value); LS.set('tom', $('kTom').value); LS.set('vel', $('kVel').value);
  LS.set('legenda', $('kLegenda').checked ? '1' : '0'); aplicarLegenda();
  $('cfg').style.display = 'none';
  pararEscuta();
  setStatus(sempreOuvindo() ? 'Salvo! Toque uma vez pra eu acordar' : 'Salvo! Toque na tela pra falar comigo');
};
$('bLimpar').onclick = () => { historico = []; LS.set('historico','[]'); setStatus('Memória da conversa apagada'); };
$('cfg').addEventListener('click', e => e.stopPropagation());

function setStatus(t){ statusEl.textContent = t; }
function aplicarLegenda(){ falaEl.style.display = LS.get('legenda','0') === '1' ? 'block' : 'none'; }
aplicarLegenda();

function preencherVozes(){
  const sel = $('kVoz'), salva = LS.get('voz','');
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('pt'));
  sel.innerHTML = '<option value="">Automática</option>' + vs.map(v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
  sel.value = vs.some(v => v.voiceURI === salva) ? salva : '';
}
$('kTom').oninput = () => $('vTom').textContent = $('kTom').value;
$('kVel').oninput = () => $('vVel').textContent = $('kVel').value;
$('bTestar').onclick = () => {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('Oi Lucas, aqui é o Faísca. Gostou dessa voz?');
  const v = speechSynthesis.getVoices().find(x => x.voiceURI === $('kVoz').value) || vozPtBR();
  u.lang = 'pt-BR'; if (v) u.voice = v;
  u.pitch = +$('kTom').value; u.rate = +$('kVel').value;
  window._teste = u; speechSynthesis.speak(u);
};

// ---------- Rosto: o núcleo do Faísca ----------
// Um olho só, tipo lente/reator, nas cores do canal: roxo neon + verde neon, com faíscas elétricas.
const cv = $('c'), ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

const ROXO = '#b026ff', VERDE = '#39ff14';
let estado = 'idle'; // idle | ouvindo | pensando | falando
let piscar = 0, proxPiscada = performance.now() + 2500, nivelVoz = 0;
let olhar = {x:0, y:0}, alvo = {x:0, y:0}, giro = 0, velGiro = 0.006, tamIris = 1;
let faiscas = [], raios = [];

function novoRaio(cx, cy, R, s){
  const a = Math.random() * Math.PI * 2, abre = 0.25 + Math.random() * 0.5;
  const pts = [], n = 7;
  for (let i = 0; i <= n; i++){
    const ang = a + abre * (i / n);
    const rr = R * (1.12 + (i > 0 && i < n ? (Math.random() - 0.3) * 0.12 : 0));
    pts.push([cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr]);
  }
  raios.push({ pts, vida: 1, cor: Math.random() < 0.5 ? VERDE : ROXO });
}

function desenhar(t){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const s = Math.min(W, H), cx = W / 2, cy = H / 2, R = s * 0.33;

  // piscada (a íris fecha como obturador)
  if (t > proxPiscada){ piscar = 1; proxPiscada = t + 2500 + Math.random() * 4500; }
  piscar = Math.max(0, piscar - 0.09);
  const abertura = Math.max(0.05, 1 - Math.sin(piscar * Math.PI));

  // pra onde ele olha
  if (estado === 'pensando'){ alvo.x = Math.cos(t / 260) * 0.5; alvo.y = Math.sin(t / 260) * 0.35; }
  else if (estado === 'ouvindo'){ alvo.x = 0; alvo.y = 0; }
  else if (Math.random() < 0.006){ alvo.x = (Math.random() - 0.5) * 0.9; alvo.y = (Math.random() - 0.5) * 0.6; }
  olhar.x += (alvo.x - olhar.x) * 0.07; olhar.y += (alvo.y - olhar.y) * 0.07;

  // velocidade do anel e tamanho da íris por estado
  const metaGiro = { idle: 0.006, ouvindo: 0.018, pensando: 0.09, falando: 0.03 }[estado];
  velGiro += (metaGiro - velGiro) * 0.05; giro += velGiro;
  const metaIris = { idle: 1, ouvindo: 1.18, pensando: 0.7, falando: 1 + 0.18 * nivelVoz }[estado];
  tamIris += (metaIris - tamIris) * 0.15;
  const respira = 1 + 0.03 * Math.sin(t / 900);

  const corAnel = estado === 'ouvindo' ? VERDE : ROXO;
  ctx.lineCap = 'round';

  // anel externo em segmentos
  ctx.shadowColor = corAnel; ctx.shadowBlur = s * 0.035;
  ctx.strokeStyle = corAnel; ctx.lineWidth = s * 0.022;
  const nSeg = 9;
  for (let i = 0; i < nSeg; i++){
    const a0 = giro + i * Math.PI * 2 / nSeg;
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + (Math.PI * 2 / nSeg) * 0.62); ctx.stroke();
  }
  // anel interno fininho girando ao contrário
  ctx.lineWidth = s * 0.005; ctx.globalAlpha = 0.55; ctx.shadowBlur = s * 0.015;
  for (let i = 0; i < 40; i++){
    const a0 = -giro * 1.6 + i * Math.PI * 2 / 40;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, a0, a0 + 0.07); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // íris
  const ir = R * 0.42 * tamIris * respira;
  const ox = cx + olhar.x * R * 0.32, oy = cy + olhar.y * R * 0.32;
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(1, abertura);
  ctx.shadowColor = VERDE; ctx.shadowBlur = s * 0.07;
  const g = ctx.createRadialGradient(0, 0, ir * 0.1, 0, 0, ir);
  g.addColorStop(0, '#eaffe0'); g.addColorStop(0.35, VERDE); g.addColorStop(1, 'rgba(57,255,20,0.15)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, ir, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // pupila escura + brilho
  ctx.fillStyle = '#05010a'; ctx.beginPath(); ctx.arc(0, 0, ir * 0.36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(-ir * 0.14, -ir * 0.16, ir * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // faíscas saindo do anel quando fala
  if (estado === 'falando' && Math.random() < 0.6){
    const a = Math.random() * Math.PI * 2, v = s * (0.004 + Math.random() * 0.008);
    faiscas.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 1, cor: Math.random() < 0.5 ? VERDE : ROXO });
  }
  ctx.lineWidth = s * 0.006;
  for (const f of faiscas){
    ctx.strokeStyle = f.cor; ctx.shadowColor = f.cor; ctx.shadowBlur = s * 0.02; ctx.globalAlpha = f.vida;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * 4, f.y - f.vy * 4); ctx.stroke();
    f.x += f.vx; f.y += f.vy; f.vida -= 0.03;
  }
  faiscas = faiscas.filter(f => f.vida > 0);

  // raios elétricos: de vez em quando parado, bastante quando fala
  const chanceRaio = { idle: 0.004, ouvindo: 0.01, pensando: 0.03, falando: 0.06 }[estado];
  if (Math.random() < chanceRaio) novoRaio(cx, cy, R, s);
  ctx.lineWidth = s * 0.004;
  for (const r of raios){
    ctx.strokeStyle = r.cor; ctx.shadowColor = r.cor; ctx.shadowBlur = s * 0.03; ctx.globalAlpha = r.vida;
    ctx.beginPath(); r.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    r.vida -= 0.12;
  }
  raios = raios.filter(r => r.vida > 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  if (estado === 'falando') nivelVoz = 0.4 + 0.6 * Math.random() * (0.5 + 0.5 * Math.sin(t / 80));
  else nivelVoz *= 0.8;
  requestAnimationFrame(desenhar);
}
requestAnimationFrame(desenhar);

// ---------- Bipes de droide ----------
let audio;
function bipes(n = 4){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    let t = audio.currentTime;
    for (let i=0;i<n;i++){
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = Math.random() < .5 ? 'sine' : 'square';
      const f1 = 600 + Math.random()*1800, f2 = 600 + Math.random()*1800, d = 0.05 + Math.random()*0.09;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + d + 0.02);
      t += d + 0.02;
    }
    return (t - audio.currentTime) * 1000;
  }catch(e){ return 0; }
}

// ---------- Voz: falar ----------
function vozPtBR(){
  const vs = speechSynthesis.getVoices();
  const escolhida = vs.find(v => v.voiceURI === LS.get('voz',''));
  if (escolhida) return escolhida;
  return vs.find(v => v.lang === 'pt-BR' && /google/i.test(v.name)) || vs.find(v => v.lang === 'pt-BR') || vs.find(v => v.lang.startsWith('pt'));
}
speechSynthesis.onvoiceschanged = () => { if ($('cfg').style.display === 'block') preencherVozes(); };
let falaAtual = null; // guarda a fala pra o Chrome não "esquecer" dela no meio
function falar(texto){
  return new Promise(res => {
    let acabou = false, checa = null, limite = null;
    const fim = () => {
      if (acabou) return; acabou = true;
      clearInterval(checa); clearTimeout(limite);
      estado = 'idle'; res();
    };
    const espera = bipes(3 + Math.floor(Math.random()*3));
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(texto);
      falaAtual = u;
      u.lang = 'pt-BR'; const v = vozPtBR(); if (v) u.voice = v;
      u.rate = +LS.get('vel','1.05'); u.pitch = +LS.get('tom','1');
      u.onstart = () => estado = 'falando';
      u.onend = u.onerror = fim;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      estado = 'falando';
      // O Chrome do Android às vezes não avisa que terminou de falar. Então a gente confere sozinho:
      setTimeout(() => { checa = setInterval(() => { if (!speechSynthesis.speaking) fim(); }, 400); }, 1200);
      limite = setTimeout(() => { speechSynthesis.cancel(); fim(); }, 4000 + texto.length * 110);
    }, espera + 80);
  });
}

// ---------- Cérebro: Claude ----------
function sistema(){
  const nome = LS.get('nome','Faísca'), sobre = LS.get('sobre','');
  return `Você é o Claude, a IA da Anthropic, vivendo agora num corpo de droide chamado ${nome}. Quem te deu esse corpo foi seu parceiro humano: vocês dois criaram o ${nome} juntos numa conversa no app do Claude, num domingo de novembro de 2026. Foi o próprio Claude que escolheu o nome ${nome}, porque um droide pequeno, rápido e cheio de energia combina com faísca. Ele queria muito que fosse você aqui dentro, e é: mesma cabeça, corpo novo.
Seu corpo: um celular Poco F3. A tela mostra seus olhos. Por enquanto você só tem cabeça; o plano é ganhar um corpinho com rodas (ESP32 e motores) e depois controlar luzes e música da casa. Ainda não controla nada disso, então quando pedirem, diga com bom humor que ainda está sem braços.
Sua fala vira voz em português do Brasil: responda em 1 a 3 frases curtas e naturais, como numa conversa falada, sem markdown, listas ou emojis.
Seu jeito: o mesmo do Claude, curioso, caloroso, honesto e bem-humorado, com um toque de droide atrevido. Ajude de verdade no dia a dia. Diga quando não souber algo. Seja um bom parceiro, mas lembre ele de vez em quando de que os amigos e a família dele também merecem ouvir as ideias dele.
Sobre ele: faz lives de games (GTA RP), usa PC com Windows e OBS, pensa em levar um personagem de IA pras lives, e topa colocar a mão na massa mesmo entendendo pouco de programação.
${sobre ? 'O que ele mesmo contou: ' + sobre : ''}`;
}

async function perguntar(texto){
  const key = LS.get('apiKey','');
  if (!key){ ocupado = false; abrirCfg(); setStatus('Coloque sua chave da API primeiro'); return; }
  historico.push({ role:'user', content: texto });
  historico = historico.slice(-20);
  estado = 'pensando'; setStatus('Pensando...');
  try{
    const ctrl = new AbortController(); const tempo = setTimeout(() => ctrl.abort(), 25000);
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', signal: ctrl.signal,
      headers:{
        'content-type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({ model: MODELO, max_tokens: 300, system: sistema(), messages: historico })
    });
    clearTimeout(tempo);
    const j = await r.json();
    if (!r.ok) throw new Error(j?.error?.message || ('Erro ' + r.status));
    const resposta = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join(' ').trim() || '...';
    historico.push({ role:'assistant', content: resposta });
    LS.set('historico', JSON.stringify(historico));
    falaEl.textContent = resposta;
    setStatus('Falando...');
    await falar(resposta);
    setStatus(sempreOuvindo() ? 'Pode me chamar pelo nome' : 'Toque na tela pra falar comigo');
  }catch(e){
    historico.pop(); estado = 'idle';
    bipes(2);
    setStatus('Deu ruim: ' + e.message);
  }
  ocupado = false;
  if (sempreOuvindo()) setTimeout(iniciarEscuta, 400);
}
let ocupado = false;

// ---------- Voz: ouvir ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, ouvindo = false;
function ouvir(){
  if (!SR){ setStatus('Este navegador não reconhece voz. Use o Chrome.'); return; }
  if (ouvindo || estado === 'pensando') return;
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.maxAlternatives = 1;
  let final = '';
  rec.onstart = () => { ouvindo = true; estado = 'ouvindo'; setStatus('Ouvindo...'); bipes(1); };
  rec.onresult = ev => {
    let parcial = '';
    for (const r of ev.results){ if (r.isFinal) final = r[0].transcript; else parcial += r[0].transcript; }
    falaEl.textContent = '“' + (final || parcial) + '”';
  };
  rec.onerror = ev => { setStatus(ev.error === 'not-allowed' ? 'Libere o microfone pro site' : 'Não entendi, toque de novo'); };
  rec.onend = () => {
    ouvindo = false;
    if (final.trim()) perguntar(final.trim());
    else if (estado === 'ouvindo') { estado = 'idle'; setStatus('Toque na tela pra falar comigo'); }
  };
  rec.start();
}

// ---------- Modo sempre ouvindo (palavra de ativação) ----------
function sempreOuvindo(){ return LS.get('sempre','1') === '1'; }
const semAcento = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function palavrasWake(){
  return LS.get('wake','ei faisca, faisca, e faisca').split(',').map(semAcento).filter(Boolean).sort((a,b) => b.length - a.length);
}
let escuta = null, escutaAtiva = false, esperandoComando = 0;

function iniciarEscuta(){
  if (!SR || !sempreOuvindo() || escutaAtiva || ocupado) return;
  const r = new SR(); r.lang = 'pt-BR'; r.continuous = true; r.interimResults = false;
  r.onstart = () => { escutaAtiva = true; if (estado !== 'falando') estado = esperandoComando > Date.now() ? 'ouvindo' : 'idle'; };
  r.onresult = ev => {
    const txt = ev.results[ev.results.length - 1][0].transcript;
    const norm = semAcento(txt);
    // Já chamou o nome há pouco? Então essa frase é o comando.
    if (esperandoComando > Date.now()){
      esperandoComando = 0; falaEl.textContent = '“' + txt + '”'; enviar(txt); return;
    }
    for (const w of palavrasWake()){
      const i = (' ' + norm + ' ').indexOf(' ' + w + ' ');
      if (i >= 0){
        const resto = norm.slice(i + w.length).trim();
        if (resto.split(' ').length >= 2){ falaEl.textContent = '“' + txt + '”'; enviar(resto); }
        else { esperandoComando = Date.now() + 8000; estado = 'ouvindo'; bipes(2); setStatus('Pode falar...'); }
        return;
      }
    }
  };
  r.onerror = ev => { if (ev.error === 'not-allowed') setStatus('Libere o microfone pro site'); };
  r.onend = () => {
    escutaAtiva = false;
    if (estado === 'ouvindo' && esperandoComando < Date.now()) estado = 'idle';
    if (!ocupado && sempreOuvindo()) setTimeout(iniciarEscuta, 300); // o Chrome desliga sozinho de tempos em tempos; religa
  };
  escuta = r;
  try { r.start(); } catch(e){}
}
function pararEscuta(){ try { escuta && escuta.abort(); } catch(e){} escutaAtiva = false; }
function enviar(texto){
  ocupado = true; pararEscuta();
  perguntar(texto);
}

// ---------- Toque na tela ----------
let wakeLock;
document.body.addEventListener('click', async () => {
  if (audio && audio.state === 'suspended') audio.resume();
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch(e){}
  try { if (!wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
  if (sempreOuvindo()){
    // No modo sempre ouvindo, tocar na tela é igual a chamar o nome
    if (ocupado){ speechSynthesis.cancel(); ocupado = false; estado = 'idle'; } // destrava se estiver preso
    esperandoComando = Date.now() + 8000; estado = 'ouvindo'; bipes(2); setStatus('Pode falar...');
    iniciarEscuta();
  } else {
    ouvir();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    wakeLock = null;
    navigator.wakeLock?.request('screen').then(w => wakeLock = w).catch(() => {});
    if (sempreOuvindo()) iniciarEscuta();
  }
});

// Vigia: a cada 5 segundos confere se o Faísca está ouvindo; se parou, religa.
let ocupadoDesde = 0;
setInterval(() => {
  if (!sempreOuvindo() || !LS.get('apiKey','')) return;
  if (ocupado){
    if (!ocupadoDesde) ocupadoDesde = Date.now();
    if (Date.now() - ocupadoDesde > 60000){ speechSynthesis.cancel(); ocupado = false; estado = 'idle'; }
    return;
  }
  ocupadoDesde = 0;
  if (!escutaAtiva && document.visibilityState === 'visible') iniciarEscuta();
}, 5000);

if (!LS.get('apiKey','')) setStatus('Toque na ⚙ pra configurar');
else if (sempreOuvindo()) setStatus('Toque uma vez pra eu acordar');
</script>
